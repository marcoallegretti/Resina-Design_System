[package]
name = "resina-resolver"
version = "0.1.0"
edition = "2024"
description = "Headless Resina capability and fallback resolution"

[dependencies]
resina-color = { path = "../resina-color" }
resina-environment = { path = "../resina-environment" }
resina-model = { path = "../resina-model" }
resina-tokens = { path = "../resina-tokens" }
serde = { version = "1", features = ["derive"] }
serde_json.workspace = true
