name: Reference checks

"on":
  push:
  pull_request:

permissions:
  contents: read

jobs:
  rust:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            executableSuffix: ''
          - os: windows-latest
            executableSuffix: '.exe'
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - run: cargo fmt --all -- --check
      - run: cargo test --workspace --locked
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m pip install -r tools/requirements-schema.txt
      - run: python -m unittest discover -s tools -p 'test_*.py'
      - run: cargo build -p resina-resolver --bins --locked
      - run: cargo build -p resina-tokens --bins --locked
      - run: python tools/check_token_backend.py -- target/debug/resina-token-resolve${{ matrix.executableSuffix }} -
      - run: python tools/check_resolver_backend.py -- target/debug/resina-token-compose${{ matrix.executableSuffix }} -
      - run: python tools/check_headless_backend.py -- target/debug/resina-headless${{ matrix.executableSuffix }} -
      - run: python tools/check_theme_backend.py -- target/debug/resina-theme-resolve${{ matrix.executableSuffix }} -
      - run: python tools/check_surface_backend.py -- target/debug/resina-surface-bind${{ matrix.executableSuffix }} -
      - run: python tools/check_frost_legibility_backend.py -- target/debug/resina-frost-legibility${{ matrix.executableSuffix }} -
      - run: python tools/check_edge_contrast_backend.py -- target/debug/resina-edge-contrast${{ matrix.executableSuffix }} -
      - run: python tools/check_elevation_depth_backend.py -- target/debug/resina-elevation-depth${{ matrix.executableSuffix }} -
      - run: python tools/check_shape_fallback_backend.py -- target/debug/resina-shape-fallback${{ matrix.executableSuffix }} -
      - run: python tools/check_frost_surface_readability_backend.py -- target/debug/resina-frost-surface-readability${{ matrix.executableSuffix }} -
      - run: python tools/check_surface_readability_backend.py -- target/debug/resina-surface-readability${{ matrix.executableSuffix }} -
      - run: python tools/check_focus_indicator_backend.py -- target/debug/resina-focus-indicator${{ matrix.executableSuffix }} -
  schemas:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m pip install -r tools/requirements-schema.txt
      - run: python tools/check_schemas.py
