name: Reference checks

"on":
  push:
  pull_request:

permissions:
  contents: read

jobs:
  guido:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install GUIdo build and software GPU dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends --no-upgrade -y libwayland-dev libxkbcommon-dev libvulkan1 mesa-vulkan-drivers fonts-dejavu-core
      - run: cargo fmt --manifest-path backends/guido/resina-guido/Cargo.toml -- --check
      - run: python -m pip install -r tools/requirements-schema.txt
      - run: cargo build -p resina-resolver --bin resina-theme-resolve --locked
      - run: python tools/material_scenarios.py -- target/debug/resina-theme-resolve - > target/material-scenes.json
      - name: Check preparation and required GPU rendering
        env:
          RESINA_SCENES: ${{ github.workspace }}/target/material-scenes.json
          RESINA_LABEL_FONT: /usr/share/fonts/truetype/dejavu/DejaVuSans.ttf
        run: cargo test --manifest-path backends/guido/resina-guido/Cargo.toml --locked --features testing
      - run: cargo clippy --manifest-path backends/guido/resina-guido/Cargo.toml --all-targets --features testing --locked -- -D warnings
  rust:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            executableSuffix: ''
          - os: windows-latest
            executableSuffix: '.exe'
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - run: cargo fmt --all -- --check
      - run: cargo test --workspace --locked
      - run: cargo test --release -p resina-resolver --test hit_region --test slider_value --test slider_adjustment --test slider_layout --test slider_position --test slider_edit --locked
      - run: cargo test -p resina-raster --no-default-features --locked
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo clippy -p resina-raster --no-default-features --all-targets --locked -- -D warnings
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m pip install -r tools/requirements-schema.txt
      - run: python -m pip install -r tools/requirements-render.txt
      - run: python -m unittest discover -s tools -p 'test_*.py'
      - run: cargo build -p resina-resolver --bins --locked
      - run: cargo build -p resina-tokens --bins --locked
      - run: cargo build -p resina-motion --bins --locked
      - run: cargo build -p resina-svg --bins --locked
      - run: cargo build -p resina-qml --bins --locked
      - run: cargo build -p resina-slint --bins --locked
      - run: python tools/check_focus_slint_backend.py -- target/debug/resina-focus-slint${{ matrix.executableSuffix }} -
      - name: Check native Slint focus
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends --no-upgrade -y libinput10 libxkbcommon-x11-0 at-spi2-core dbus-bin dbus-daemon gsettings-desktop-schemas xvfb xauth
          mkdir -p target/slint-viewer
          curl --fail --location --retry 3 https://github.com/slint-ui/slint/releases/download/v1.18.1/slint-viewer-x86_64-unknown-linux-gnu.tar.gz -o target/slint-viewer.tar.gz
          echo '86b260e661cdc24dcadaf63266b034f3281cbec542afc26545a72a986fe42a13  target/slint-viewer.tar.gz' | sha256sum --check
          tar -xzf target/slint-viewer.tar.gz -C target/slint-viewer
          target/slint-viewer/slint-viewer/slint-viewer --check conformance/slint/focus-recovery.slint
          python tools/check_slint_focus_recovery.py --image target/slint-viewer/focus-recovery.png -- target/slint-viewer/slint-viewer/slint-viewer
          target/slint-viewer/slint-viewer/slint-viewer --check conformance/slint/focus-probe.slint
          for scale in 1 1.25 2 3; do
            python tools/check_slint_focus_runtime.py --image "target/slint-viewer/focus-$scale.png" --scale "$scale" -- env SLINT_SCALE_FACTOR="$scale" target/slint-viewer/slint-viewer/slint-viewer --screenshot "target/slint-viewer/focus-$scale.png" conformance/slint/focus-probe.slint
          done
      - name: Measure native Slint availability
        if: runner.os == 'Linux'
        shell: bash
        run: |
          target/slint-viewer/slint-viewer/slint-viewer --check conformance/slint/availability-probe.slint
          resina_probe_status=0
          xvfb-run -a -e /dev/stderr python tools/check_slint_native_availability.py --report-only -- target/slint-viewer/slint-viewer/slint-viewer > target/slint-viewer/native-availability.json || resina_probe_status=$?
          cat target/slint-viewer/native-availability.json
          exit "$resina_probe_status"
      - name: Save native Slint availability report
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v7
        with:
          name: slint-native-availability
          path: target/slint-viewer/native-availability.json
          if-no-files-found: error
      - run: python tools/check_focus_qml_backend.py -- target/debug/resina-focus-qml${{ matrix.executableSuffix }} -
      - run: python tools/check_focus_svg_backend.py -- target/debug/resina-focus-svg${{ matrix.executableSuffix }} -
      - run: python tools/check_spring_backend.py -- target/debug/resina-spring${{ matrix.executableSuffix }} -
      - run: python tools/check_spring_trajectory_backend.py -- target/debug/resina-spring-trajectory${{ matrix.executableSuffix }} -
      - run: python tools/check_token_backend.py -- target/debug/resina-token-resolve${{ matrix.executableSuffix }} -
      - run: python tools/check_resolver_backend.py -- target/debug/resina-token-compose${{ matrix.executableSuffix }} -
      - run: python tools/check_headless_backend.py -- target/debug/resina-headless${{ matrix.executableSuffix }} -
      - run: python tools/check_theme_backend.py -- target/debug/resina-theme-resolve${{ matrix.executableSuffix }} -
      - run: python tools/check_surface_backend.py -- target/debug/resina-surface-bind${{ matrix.executableSuffix }} -
      - run: python tools/check_frost_legibility_backend.py -- target/debug/resina-frost-legibility${{ matrix.executableSuffix }} -
      - run: python tools/check_edge_contrast_backend.py -- target/debug/resina-edge-contrast${{ matrix.executableSuffix }} -
      - run: python tools/check_elevation_depth_backend.py -- target/debug/resina-elevation-depth${{ matrix.executableSuffix }} -
      - run: python tools/check_shape_fallback_backend.py -- target/debug/resina-shape-fallback${{ matrix.executableSuffix }} -
      - run: python tools/check_frost_surface_readability_backend.py -- target/debug/resina-frost-surface-readability${{ matrix.executableSuffix }} -
      - run: python tools/check_surface_readability_backend.py -- target/debug/resina-surface-readability${{ matrix.executableSuffix }} -
      - run: python tools/check_opaque_pigment_backend.py -- target/debug/resina-opaque-pigment${{ matrix.executableSuffix }} -
      - run: python tools/check_inset_contour_backend.py -- target/debug/resina-inset-contour${{ matrix.executableSuffix }} -
      - run: python tools/check_key_light_backend.py -- target/debug/resina-key-light${{ matrix.executableSuffix }} -
      - run: python tools/check_extruded_contour_backend.py -- target/debug/resina-extruded-contour${{ matrix.executableSuffix }} -
      - run: python tools/check_opaque_surface_backend.py -- target/debug/resina-opaque-surface${{ matrix.executableSuffix }} -
      - run: python tools/check_focus_ir_backend.py -- target/debug/resina-focus-ir${{ matrix.executableSuffix }} -
      - run: python tools/check_surface_paint_backend.py -- target/debug/resina-surface-paint${{ matrix.executableSuffix }} -
      - run: python tools/check_hit_region_backend.py -- target/debug/resina-hit-region${{ matrix.executableSuffix }} -
      - run: python tools/check_focus_traversal_backend.py -- target/debug/resina-focus-traversal${{ matrix.executableSuffix }} -
      - run: python tools/check_activation_backend.py -- target/debug/resina-activation${{ matrix.executableSuffix }} -
      - run: python tools/check_slider_value_backend.py -- target/debug/resina-slider-value${{ matrix.executableSuffix }} -
      - run: python tools/check_toggle_activation_backend.py -- target/debug/resina-toggle-activation${{ matrix.executableSuffix }} -
      - run: python tools/check_command_states_backend.py -- target/debug/resina-command-states${{ matrix.executableSuffix }} -
      - run: python tools/check_toggle_states_backend.py -- target/debug/resina-toggle-states${{ matrix.executableSuffix }} -
      - run: python tools/check_toggle_layout_backend.py -- target/debug/resina-toggle-layout${{ matrix.executableSuffix }} -
      - run: python tools/check_command_paint_backend.py -- target/debug/resina-command-paint${{ matrix.executableSuffix }} -
      - run: python tools/check_toggle_part_paint_backend.py -- target/debug/resina-toggle-part-paint${{ matrix.executableSuffix }} -
      - run: python tools/check_command_motion_backend.py -- target/debug/resina-command-motion${{ matrix.executableSuffix }} -
      - run: python tools/check_toggle_part_motion_backend.py -- target/debug/resina-toggle-part-motion${{ matrix.executableSuffix }} -
      - run: python tools/check_material_scenarios.py --theme-backend target/debug/resina-theme-resolve${{ matrix.executableSuffix }} --surface-backend target/debug/resina-opaque-surface${{ matrix.executableSuffix }} --focus-backend target/debug/resina-focus-ir${{ matrix.executableSuffix }} --paint-backend target/debug/resina-surface-paint${{ matrix.executableSuffix }}
      - run: python tools/check_focus_indicator_backend.py -- target/debug/resina-focus-indicator${{ matrix.executableSuffix }} -
  schemas:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m pip install -r tools/requirements-schema.txt
      - run: python tools/check_schemas.py
