name: Reference checks

"on":
  push:
  pull_request:

permissions:
  contents: read

jobs:
  qt-runtime:
    runs-on: ubuntu-24.04
    env:
      QMAKE: ${{ github.workspace }}/target/qt-sdk/6.11.2/gcc_64/bin/qmake
      CARGO_TARGET_DIR: ${{ github.workspace }}/target/qt-runtime-build
      CXX_QT_EXPORT_DIR: ${{ github.workspace }}/target/qt-runtime-export
      QT_QPA_PLATFORM: offscreen
      QT_QUICK_BACKEND: software
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install Qt build, font and native AT-SPI dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends --no-upgrade -y \
            g++ pkg-config lld cmake ninja-build libgl-dev libegl-dev libfontconfig1 libfreetype6 \
            libdrm-dev libwayland-dev wayland-protocols libcli11-dev spirv-tools libjemalloc-dev \
            meson libffi-dev libexpat1-dev curl \
            libxkbcommon-dev libxkbcommon-x11-0 libx11-xcb1 \
            libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 \
            libxcb-randr0 libxcb-render-util0 libxcb-shape0 libxcb-shm0 \
            libxcb-sync1 libxcb-xfixes0 libxcb-xkb1 fonts-dejavu-core \
            at-spi2-core dbus-bin dbus-daemon gsettings-desktop-schemas xvfb xauth sway \
            xdg-desktop-portal xdg-desktop-portal-gnome dconf-service libglib2.0-bin grim
          python -m pip install aqtinstall==3.3.0 -r tools/requirements-qt-native.txt -r tools/requirements-render.txt -r tools/requirements-schema.txt
          python -m aqt install-qt linux desktop 6.11.2 linux_gcc_64 --outputdir target/qt-sdk --archives qtbase qtdeclarative icu --modules qtshadertools
      - name: Build matching Wayland headers and libraries for Qt 6.11.2
        run: |
          curl --fail --location https://gitlab.freedesktop.org/wayland/wayland/-/releases/1.24.0/downloads/wayland-1.24.0.tar.xz --output target/wayland-1.24.0.tar.xz
          printf '%s\n' '82892487a01ad67b334eca83b54317a7c86a03a89cfadacfef5211f11a5d0536  target/wayland-1.24.0.tar.xz' | sha256sum -c
          tar -xf target/wayland-1.24.0.tar.xz -C target
          meson setup target/wayland-build target/wayland-1.24.0 --prefix "$PWD/target/wayland-sdk" --libdir lib -Ddocumentation=false -Dtests=false -Ddtd_validation=false
          meson compile -C target/wayland-build -j 2
          meson install -C target/wayland-build
      - name: Build the released Quickshell host with the matching Qt SDK
        run: |
          export LD_LIBRARY_PATH="$PWD/target/wayland-sdk/lib:$PWD/target/qt-sdk/6.11.2/gcc_64/lib${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}"
          export PKG_CONFIG_PATH="$PWD/target/wayland-sdk/lib/pkgconfig${PKG_CONFIG_PATH:+:$PKG_CONFIG_PATH}"
          export PATH="$PWD/target/wayland-sdk/bin:$PATH"
          git clone --branch v0.3.2 --depth 1 https://github.com/quickshell-mirror/quickshell.git target/quickshell-source
          test "$(git -C target/quickshell-source rev-parse HEAD)" = 4f508be500dea6e5732cc3d50382a0048b17e7b1
          cmake -S target/quickshell-source -B target/quickshell-build -G Ninja \
            -DCMAKE_BUILD_TYPE=RelWithDebInfo -DCMAKE_PREFIX_PATH="$PWD/target/qt-sdk/6.11.2/gcc_64;$PWD/target/wayland-sdk" \
            -DCRASH_HANDLER=OFF -DSCREENCOPY=OFF -DHYPRLAND=OFF -DI3=OFF \
            -DSERVICE_PIPEWIRE=OFF -DSERVICE_PAM=OFF -DSERVICE_POLKIT=OFF -DSERVICE_GREETD=OFF \
            -DSERVICE_STATUS_NOTIFIER=OFF -DSERVICE_MPRIS=OFF -DSERVICE_UPOWER=OFF \
            -DSERVICE_NOTIFICATIONS=OFF -DBLUETOOTH=OFF -DNETWORK=OFF
          cmake --build target/quickshell-build --parallel 2
      - name: Build and check the separate Qt workspace
        run: |
          export LD_LIBRARY_PATH="$PWD/target/qt-sdk/6.11.2/gcc_64/lib${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}"
          cargo fmt --manifest-path backends/quickshell/resina-qt-runtime/Cargo.toml -- --check
          cargo test --manifest-path backends/quickshell/resina-qt-runtime/Cargo.toml --locked
          cargo clippy --manifest-path backends/quickshell/resina-qt-runtime/Cargo.toml --all-targets --locked -- -D warnings
          cargo build --manifest-path backends/quickshell/resina-qt-runtime/Cargo.toml --locked
          cargo build -p resina-raster --bin resina-command-raster --bin resina-command-motion-raster --bin resina-toggle-part-raster --bin resina-toggle-part-motion-raster --bin resina-paint-raster --locked
          cargo build -p resina-resolver --bin resina-theme-resolve --bin resina-surface-paint --locked
          python tools/material_scenarios.py -- target/qt-runtime-build/debug/resina-theme-resolve - > target/material-scenes.json
          python tools/prepare_qt_runtime_module.py --library target/qt-runtime-build/debug/libresina_qt_runtime.so --metadata-dir target/qt-runtime-export/qml_modules/Resina/Runtime --output-dir target/qt-runtime-import
      - name: Check compiled controller, native content and coherent snapshots
        run: |
          python tools/check_qt_controller_lifetime.py --module-path target/qt-runtime-import
          python tools/check_qt_controller_lifetime.py --module-path target/qt-runtime-import --controller ToggleController
          python tools/check_qt_command_runtime.py --module-path target/qt-runtime-import
          python tools/check_qt_toggle_runtime.py --module-path target/qt-runtime-import
          python tools/check_qt_toggle_control_runtime.py --motion --raster target/qt-runtime-build/debug/resina-toggle-part-motion-raster --module-path target/qt-runtime-import --font /usr/share/fonts/truetype/dejavu/DejaVuSans.ttf --output-dir target/qt-toggle-moving-control
          python tools/check_qt_command_label_runtime.py --module-path target/qt-runtime-import --font /usr/share/fonts/truetype/dejavu/DejaVuSans.ttf
          python tools/check_qt_command_snapshot_runtime.py --module-path target/qt-runtime-import --font /usr/share/fonts/truetype/dejavu/DejaVuSans.ttf
          python tools/check_qt_command_keyboard_runtime.py --module-path target/qt-runtime-import --font /usr/share/fonts/truetype/dejavu/DejaVuSans.ttf
          python tools/check_qt_command_pointer_runtime.py --module-path target/qt-runtime-import --font /usr/share/fonts/truetype/dejavu/DejaVuSans.ttf
          python tools/check_qt_command_control_runtime.py --motion --module-path target/qt-runtime-import --font /usr/share/fonts/truetype/dejavu/DejaVuSans.ttf --output-dir target/qt-control-motion
      - name: Check actual Qt paint and command composition at native scales
        run: |
          for scale in 1 1.25 2 1.3; do
            QT_SCALE_FACTOR="$scale" python tools/check_qt_surface_view_runtime.py --module-path target/qt-runtime-import --raster target/qt-runtime-build/debug/resina-paint-raster --resolver target/qt-runtime-build/debug/resina-surface-paint --theme-resolver target/qt-runtime-build/debug/resina-theme-resolve --scenes target/material-scenes.json --output-dir "target/qt-surface-view-$scale"
            QT_SCALE_FACTOR="$scale" python tools/check_qt_command_paint_runtime.py --module-path target/qt-runtime-import --font /usr/share/fonts/truetype/dejavu/DejaVuSans.ttf --raster target/qt-runtime-build/debug/resina-command-raster --output-dir "target/qt-paint-$scale"
            QT_SCALE_FACTOR="$scale" python tools/check_qt_toggle_motion_runtime.py --raster target/qt-runtime-build/debug/resina-toggle-part-motion-raster --module-path target/qt-runtime-import --font /usr/share/fonts/truetype/dejavu/DejaVuSans.ttf --output-dir "target/qt-toggle-motion-$scale"
            QT_SCALE_FACTOR="$scale" python tools/check_qt_toggle_control_runtime.py --raster target/qt-runtime-build/debug/resina-toggle-part-raster --module-path target/qt-runtime-import --font /usr/share/fonts/truetype/dejavu/DejaVuSans.ttf --output-dir "target/qt-toggle-$scale"
            QT_SCALE_FACTOR="$scale" python tools/check_qt_command_control_runtime.py --module-path target/qt-runtime-import --font /usr/share/fonts/truetype/dejavu/DejaVuSans.ttf --output-dir "target/qt-control-$scale"
            QT_SCALE_FACTOR="$scale" python tools/check_qt_command_motion_runtime.py --raster target/qt-runtime-build/debug/resina-command-motion-raster --module-path target/qt-runtime-import --font /usr/share/fonts/truetype/dejavu/DejaVuSans.ttf --output-dir "target/qt-motion-$scale"
            QT_SCALE_FACTOR="$scale" python tools/check_qt_command_view_runtime.py --module-path target/qt-runtime-import --font /usr/share/fonts/truetype/dejavu/DejaVuSans.ttf --output-dir "target/qt-view-$scale"
          done
      - name: Measure native AT-SPI availability and invocation
        env:
          RESINA_QT_RUNTIME_MODULE: ${{ github.workspace }}/target/qt-runtime-import
        run: |
          xvfb-run -a -e /dev/stderr python tools/check_qt_native_availability.py --report-only > target/qt-native-availability.json
          cat target/qt-native-availability.json
          xvfb-run -a -e /dev/stderr python tools/check_qt_command_control_accessibility.py --module-path target/qt-runtime-import --font /usr/share/fonts/truetype/dejavu/DejaVuSans.ttf > target/qt-control-accessibility.json
          cat target/qt-control-accessibility.json
          xvfb-run -a -e /dev/stderr python tools/check_qt_command_control_accessibility.py --motion --module-path target/qt-runtime-import --font /usr/share/fonts/truetype/dejavu/DejaVuSans.ttf > target/qt-motion-accessibility.json
          cat target/qt-motion-accessibility.json
          xvfb-run -a -e /dev/stderr python tools/check_qt_slider_accessibility_adapter.py --module-path target/qt-runtime-import --orientation horizontal > target/qt-slider-horizontal-accessibility.json
          cat target/qt-slider-horizontal-accessibility.json
          xvfb-run -a -e /dev/stderr python tools/check_qt_slider_accessibility_adapter.py --module-path target/qt-runtime-import --orientation vertical > target/qt-slider-vertical-accessibility.json
          cat target/qt-slider-vertical-accessibility.json
      - name: Measure released Quickshell native publication and invocation
        env:
          RESINA_QT_RUNTIME_MODULE: ${{ github.workspace }}/target/qt-runtime-import
          RESINA_QUICKSHELL_HOST: ${{ github.workspace }}/target/quickshell-build/src/quickshell
        run: |
          export LD_LIBRARY_PATH="$PWD/target/wayland-sdk/lib:$PWD/target/qt-sdk/6.11.2/gcc_64/lib${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}"
          python tools/run_qt_availability_probe.py --version
          xvfb-run -a -e /dev/stderr python tools/check_qt_native_availability.py --report-only > target/quickshell-native-availability.json
          cat target/quickshell-native-availability.json
      - name: Check authored Command updates in released Quickshell
        run: |
          export LD_LIBRARY_PATH="$PWD/target/wayland-sdk/lib:$PWD/target/qt-sdk/6.11.2/gcc_64/lib${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}"
          python tools/check_quickshell_command_updates.py \
            --host target/quickshell-build/src/quickshell --module-path target/qt-runtime-import \
            --font /usr/share/fonts/truetype/dejavu/DejaVuSans.ttf \
            --alternate-font /usr/share/fonts/truetype/dejavu/DejaVuSansMono.ttf \
            --output-dir target/quickshell-command-updates --scales 1 1.25 2
      - name: Check authored Toggle updates in released Quickshell
        run: |
          export LD_LIBRARY_PATH="$PWD/target/wayland-sdk/lib:$PWD/target/qt-sdk/6.11.2/gcc_64/lib${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}"
          python tools/check_quickshell_toggle_updates.py \
            --host target/quickshell-build/src/quickshell --module-path target/qt-runtime-import \
            --font /usr/share/fonts/truetype/dejavu/DejaVuSans.ttf \
            --output-dir target/quickshell-toggle-updates --scales 1 1.25 2
      - name: Check compositor-delivered Command lifecycle, accessibility and motion and platform appearance
        timeout-minutes: 35
        run: |
          export LD_LIBRARY_PATH="$PWD/target/wayland-sdk/lib:$PWD/target/qt-sdk/6.11.2/gcc_64/lib${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}"
          export XDG_RUNTIME_DIR="$(mktemp -d)"
          chmod 700 "$XDG_RUNTIME_DIR"
          echo 'output HEADLESS-1 resolution 1024x600' > target/lifecycle-sway.conf
          WLR_BACKENDS=headless WLR_LIBINPUT_NO_DEVICES=1 WLR_RENDERER=pixman sway -c target/lifecycle-sway.conf > target/lifecycle-sway.log 2>&1 &
          for attempt in $(seq 50); do
            WAYLAND_DISPLAY="$(ls "$XDG_RUNTIME_DIR" | grep -m1 -E '^wayland-[0-9]+$' || true)"
            [ -n "$WAYLAND_DISPLAY" ] && break
            sleep 0.2
          done
          export WAYLAND_DISPLAY
          python tools/check_quickshell_command_lifecycle.py \
            --host target/quickshell-build/src/quickshell --module-path target/qt-runtime-import \
            --font /usr/share/fonts/truetype/dejavu/DejaVuSans.ttf \
            --output-dir target/quickshell-command-lifecycle
          python tools/check_quickshell_command_accessibility.py \
            --host target/quickshell-build/src/quickshell --module-path target/qt-runtime-import \
            --font /usr/share/fonts/truetype/dejavu/DejaVuSans.ttf \
            --output-dir target/quickshell-command-accessibility
          python tools/check_quickshell_command_motion.py \
            --host target/quickshell-build/src/quickshell --module-path target/qt-runtime-import \
            --font /usr/share/fonts/truetype/dejavu/DejaVuSans.ttf \
            --output-dir target/quickshell-command-motion
          python tools/check_qt_platform_appearance.py --module-path target/qt-runtime-import \
            --output-dir target/qt-platform-appearance --require contrast color-scheme
          python tools/check_quickshell_clock_shell.py \
            --host target/quickshell-build/src/quickshell --module-path target/qt-runtime-import \
            --font /usr/share/fonts/truetype/dejavu/DejaVuSans.ttf \
            --surface-resolver target/qt-runtime-build/debug/resina-surface-paint \
            --theme-resolver target/qt-runtime-build/debug/resina-theme-resolve \
            --grim /usr/bin/grim --output-dir target/quickshell-clock-shell
      - name: Save native Qt captures and accessibility observations
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: qt-native-command-evidence
          path: |
            target/qt-toggle-*/*.png
            target/qt-paint-*/*.png
            target/qt-surface-view-*/*.png
            target/qt-view-*/*.png
            target/qt-control-*/*.png
            target/qt-motion-*/*.png
            target/qt-motion-accessibility.json
            target/qt-slider-*-accessibility.json
            target/qt-control-accessibility.json
            target/qt-native-availability.json
            target/quickshell-native-availability.json
            target/quickshell-command-updates/
            target/quickshell-toggle-updates/
            target/quickshell-command-lifecycle/
            target/quickshell-command-accessibility/
            target/quickshell-command-motion/
            target/qt-platform-appearance/
            target/quickshell-clock-shell/
            target/lifecycle-sway.log
          if-no-files-found: warn
  guido:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install GUIdo build and software GPU dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends --no-upgrade -y libwayland-dev libxkbcommon-dev libvulkan1 mesa-vulkan-drivers fonts-dejavu-core
      - run: cargo fmt --manifest-path backends/guido/resina-guido/Cargo.toml -- --check
      - run: python -m pip install -r tools/requirements-schema.txt
      - run: cargo build -p resina-resolver --bin resina-theme-resolve --locked
      - run: python tools/material_scenarios.py -- target/debug/resina-theme-resolve - > target/material-scenes.json
      - name: Check preparation and required GPU rendering
        env:
          RESINA_SCENES: ${{ github.workspace }}/target/material-scenes.json
          RESINA_LABEL_FONT: /usr/share/fonts/truetype/dejavu/DejaVuSans.ttf
        run: cargo test --manifest-path backends/guido/resina-guido/Cargo.toml --locked --features testing
      - run: cargo clippy --manifest-path backends/guido/resina-guido/Cargo.toml --all-targets --features testing --locked -- -D warnings
      - run: cargo fmt --manifest-path lab/guido/Cargo.toml -- --check
      - name: Check native Material Board
        env:
          RESINA_SCENES: ${{ github.workspace }}/target/material-scenes.json
          RESINA_LABEL_FONT: /usr/share/fonts/truetype/dejavu/DejaVuSans.ttf
        run: cargo test --manifest-path lab/guido/Cargo.toml --locked
      - run: cargo clippy --manifest-path lab/guido/Cargo.toml --all-targets --locked -- -D warnings
  rust:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            executableSuffix: ''
            labelFont: '/usr/share/fonts/truetype/dejavu/DejaVuSans.ttf'
          - os: windows-latest
            executableSuffix: '.exe'
            labelFont: 'C:/Windows/Fonts/arial.ttf'
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - run: cargo fmt --all -- --check
      - run: cargo test --workspace --locked
        env:
          RESINA_SLIDER_SNAPSHOT_CAPTURE: ${{ runner.temp }}/slider-snapshot-ir.json
      - run: cargo test --release -p resina-model --test slider_appearance --locked
      - run: cargo test --release -p resina-model --test slider_appearance_records --locked
      - run: cargo test --release -p resina-model --test slider_value_records --locked
      - run: cargo test --release -p resina-model --test key_light_records --locked
      - run: cargo test --release -p resina-model --lib slider_value::tests --locked
      - run: cargo test --release -p resina-model --test geometry_records --locked
      - run: cargo test --release -p resina-model --test surface_appearance_records --locked
      - run: cargo test --release -p resina-model --lib surface_appearance::tests --locked
      - run: cargo test --release -p resina-model --test opaque_pigment_records --locked
      - run: cargo test --release -p resina-model --lib opaque_pigment::tests --locked
      - run: cargo test --release -p resina-model --test command_appearance_records --locked
      - run: cargo test --release -p resina-model --lib command_appearance::tests --locked
      - run: cargo test --release -p resina-model --test material_family_strings --locked
      - run: cargo test --release -p resina-model --lib material_assignment --locked
      - run: cargo test --release -p resina-resolver --lib contour::tests --locked
      - run: cargo test --release -p resina-color --test contrast_range --locked
      - run: cargo test --release -p resina-resolver --test common_contrast --locked
      - run: cargo test --release -p resina-resolver --test readability_ranges --locked
      - run: cargo test --release -p resina-resolver --test focus_readability_request_source --locked
      - run: cargo test --release -p resina-resolver --test standalone_color_request_source --locked
      - run: cargo test --release -p resina-resolver --test contour_request_source --locked
      - run: cargo test --release -p resina-resolver --test opaque_paint_ranges --locked
      - run: cargo test --release -p resina-resolver --test slider_part_paint --test slider_snapshot --test slider_snapshot_ir --locked
      - run: cargo test --release -p resina-resolver --test slider_part_paint_source --locked
      - run: cargo test --release -p resina-resolver --test hit_region --test slider_value --test slider_adjustment --test slider_layout --test slider_track_segments --test slider_position --test slider_edit --test slider_anchor --test slider_pointer --test slider_stops --test slider_key --test slider_presentation --test slider_accessibility --test slider_states --locked
      - run: cargo test -p resina-raster --no-default-features --locked
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo clippy -p resina-raster --no-default-features --all-targets --locked -- -D warnings
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m pip install -r tools/requirements-schema.txt
      - run: python -m pip install -r tools/requirements-render.txt
      - run: python -m pip install -r tools/requirements-toolkit.txt
      - run: python tools/check_contributor_toolkit.py
      - run: python -m unittest discover -s tools -p 'test_*.py'
      - run: python tools/check_slider_snapshot_ir.py --capture "${{ runner.temp }}/slider-snapshot-ir.json"
      - run: cargo build -p resina-resolver --bins --locked
      - name: Install Slint build and test font dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends --no-upgrade -y libfontconfig-dev fonts-dejavu-core
          pkg-config --modversion fontconfig
      - name: Check compiled Slint runtime publication and measurement
        shell: bash
        env:
          RESINA_SCENES: ${{ github.workspace }}/target/material-scenes.json
          RESINA_LABEL_FONT: ${{ matrix.labelFont }}
        run: |
          python tools/material_scenarios.py -- target/debug/resina-theme-resolve${{ matrix.executableSuffix }} - > target/material-scenes.json
          cargo fmt --manifest-path backends/slint/resina-slint-runtime/Cargo.toml -- --check
          cargo test --manifest-path backends/slint/resina-slint-runtime/Cargo.toml --no-default-features --locked
          cargo test --manifest-path backends/slint/resina-slint-runtime/Cargo.toml --features testing --locked
          cargo clippy --manifest-path backends/slint/resina-slint-runtime/Cargo.toml --all-targets --features testing --locked -- -D warnings
      - run: cargo build -p resina-tokens --bins --locked
      - run: cargo build -p resina-motion --bins --locked
      - run: cargo build -p resina-svg --bins --locked
      - run: cargo build -p resina-qml --bins --locked
      - run: cargo build -p resina-slint --bins --locked
      - run: cargo build -p resina-raster --bin resina-paint-raster --bin resina-material-relief-raster --locked
      - run: python tools/check_focus_slint_backend.py -- target/debug/resina-focus-slint${{ matrix.executableSuffix }} -
      - name: Check native Slint focus
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends --no-upgrade -y libinput10 libxkbcommon-x11-0 at-spi2-core dbus-bin dbus-daemon gsettings-desktop-schemas xvfb xauth
          mkdir -p target/slint-viewer
          curl --fail --location --retry 3 https://github.com/slint-ui/slint/releases/download/v1.18.1/slint-viewer-x86_64-unknown-linux-gnu.tar.gz -o target/slint-viewer.tar.gz
          echo '86b260e661cdc24dcadaf63266b034f3281cbec542afc26545a72a986fe42a13  target/slint-viewer.tar.gz' | sha256sum --check
          tar -xzf target/slint-viewer.tar.gz -C target/slint-viewer
          target/slint-viewer/slint-viewer/slint-viewer --check conformance/slint/focus-recovery.slint
          python tools/check_slint_focus_recovery.py --image target/slint-viewer/focus-recovery.png -- target/slint-viewer/slint-viewer/slint-viewer
          target/slint-viewer/slint-viewer/slint-viewer --check conformance/slint/focus-probe.slint
          for scale in 1 1.25 2 3; do
            python tools/check_slint_focus_runtime.py --image "target/slint-viewer/focus-$scale.png" --scale "$scale" -- env SLINT_SCALE_FACTOR="$scale" target/slint-viewer/slint-viewer/slint-viewer --screenshot "target/slint-viewer/focus-$scale.png" conformance/slint/focus-probe.slint
          done
      - name: Check native Slint complete paint
        if: runner.os == 'Linux'
        run: |
          python tools/material_scenarios.py -- target/debug/resina-theme-resolve - > target/slint-viewer/material-scenes.json
          python tools/check_slint_paint_runtime.py --backend target/debug/resina-paint-slint --raster target/debug/resina-paint-raster --resolver target/debug/resina-surface-paint --viewer target/slint-viewer/slint-viewer/slint-viewer --scenes target/slint-viewer/material-scenes.json --output-dir target/slint-viewer/paint
      - name: Save Slint paint captures
        if: always() && runner.os == 'Linux'
        uses: actions/upload-artifact@v7
        with:
          name: slint-material-paint
          path: target/slint-viewer/paint/*.png
          if-no-files-found: warn
      - name: Measure native Slint availability
        if: runner.os == 'Linux'
        shell: bash
        run: |
          target/slint-viewer/slint-viewer/slint-viewer --check conformance/slint/availability-probe.slint
          resina_probe_status=0
          xvfb-run -a -e /dev/stderr python tools/check_slint_native_availability.py --report-only -- target/slint-viewer/slint-viewer/slint-viewer > target/slint-viewer/native-availability.json || resina_probe_status=$?
          cat target/slint-viewer/native-availability.json
          exit "$resina_probe_status"
      - name: Save native Slint availability report
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v7
        with:
          name: slint-native-availability
          path: target/slint-viewer/native-availability.json
          if-no-files-found: error
