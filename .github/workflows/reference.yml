name: Reference checks

"on":
  push:
    branches: [master]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  qt-runtime:
    name: qt-runtime-${{ matrix.shard }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - shard: core
            rust_cache_suffix: ''
            save_rust_cache: false
            paint_scales: '1 2'
            output_scales: ''
            groups: [snapshots, atspi, publication, label]
          - shard: updates
            rust_cache_suffix: '-lint'
            save_rust_cache: true
            paint_scales: '1.25 1.3'
            output_scales: ''
            groups: [lint, command-updates, toggle-updates]
          - shard: lifecycle
            rust_cache_suffix: ''
            save_rust_cache: false
            paint_scales: ''
            output_scales: ''
            groups: [command-lifecycle]
          - shard: output-scales-up
            rust_cache_suffix: ''
            save_rust_cache: true
            paint_scales: ''
            output_scales: '1.25:2'
            groups: [release-module, frame-timing]
          - shard: output-scales-down
            rust_cache_suffix: ''
            save_rust_cache: false
            paint_scales: ''
            output_scales: '2:1.25'
            groups: [toggle-lifecycle]
    env:
      QMAKE: ${{ github.workspace }}/target/qt-sdk/6.11.2/gcc_64/bin/qmake
      CARGO_TARGET_DIR: ${{ github.workspace }}/target/qt-runtime-build
      CXX_QT_EXPORT_DIR: ${{ github.workspace }}/target/qt-runtime-export
      QT_QPA_PLATFORM: offscreen
      QT_QUICK_BACKEND: software
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - name: Identify the runner image
        id: runner-image
        shell: bash
        run: |
          test -n "$ImageOS"
          test -n "$ImageVersion"
          echo "name=$ImageOS" >> "$GITHUB_OUTPUT"
          echo "version=$ImageVersion" >> "$GITHUB_OUTPUT"
      - uses: Swatinem/rust-cache@v2.9.2
        with:
          key: ${{ steps.runner-image.outputs.name }}-${{ hashFiles('tools/ci/install_qt_sdk.sh') }}-${{ hashFiles('Cargo.lock') }}-debug-release${{ matrix.rust_cache_suffix }}
          workspaces: backends/quickshell/resina-qt-runtime -> ../../../target/qt-runtime-build
          save-if: ${{ github.ref == 'refs/heads/master' && matrix.save_rust_cache }}
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Restore the Qt 6.11.2 SDK
        id: qt-sdk
        uses: actions/cache/restore@v6
        with:
          path: target/qt-sdk
          key: qt-sdk-linux-${{ hashFiles('tools/ci/install_qt_sdk.sh') }}
      - name: Install Qt build, font and native AT-SPI dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends --no-upgrade -y \
            g++ pkg-config lld cmake ninja-build libgl-dev libegl-dev libfontconfig1 fontconfig libfreetype6 \
            libdrm-dev libwayland-dev wayland-protocols libcli11-dev spirv-tools libjemalloc-dev \
            meson libffi-dev libexpat1-dev curl \
            libxkbcommon-dev libxkbcommon-x11-0 libx11-xcb1 \
            libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 \
            libxcb-randr0 libxcb-render-util0 libxcb-shape0 libxcb-shm0 \
            libxcb-sync1 libxcb-xfixes0 libxcb-xkb1 fonts-dejavu-core fonts-inter \
            at-spi2-core dbus-bin dbus-daemon gsettings-desktop-schemas xvfb xauth sway \
            xdg-desktop-portal xdg-desktop-portal-gnome dconf-service libglib2.0-bin grim \
            orca speech-dispatcher
          python -m pip install -r tools/requirements-qt-native.txt -r tools/requirements-render.txt -r tools/requirements-schema.txt
          python tools/conformance_font.py verify /usr/share/fonts/opentype/inter
      - name: Install the Qt 6.11.2 SDK
        if: steps.qt-sdk.outputs.cache-hit != 'true'
        run: tools/ci/install_qt_sdk.sh
      - name: Save the Qt 6.11.2 SDK
        if: steps.qt-sdk.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: target/qt-sdk
          key: ${{ steps.qt-sdk.outputs.cache-primary-key }}
      - name: Restore matching Wayland headers and libraries
        id: wayland-sdk
        uses: actions/cache/restore@v6
        with:
          path: target/wayland-sdk
          key: wayland-sdk-${{ steps.runner-image.outputs.name }}-${{ steps.runner-image.outputs.version }}-${{ hashFiles('tools/ci/build_wayland_sdk.sh') }}
      - name: Build matching Wayland headers and libraries for Qt 6.11.2
        if: steps.wayland-sdk.outputs.cache-hit != 'true'
        run: tools/ci/build_wayland_sdk.sh
      - name: Save matching Wayland headers and libraries
        if: steps.wayland-sdk.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: target/wayland-sdk
          key: ${{ steps.wayland-sdk.outputs.cache-primary-key }}
      - name: Restore the released Quickshell host
        id: quickshell-build
        uses: actions/cache/restore@v6
        with:
          path: target/quickshell-build
          key: quickshell-${{ steps.runner-image.outputs.name }}-${{ steps.runner-image.outputs.version }}-${{ hashFiles('tools/ci/build_quickshell.sh') }}-${{ steps.qt-sdk.outputs.cache-primary-key }}-${{ steps.wayland-sdk.outputs.cache-primary-key }}
      - name: Build the released Quickshell host with the matching Qt SDK
        if: steps.quickshell-build.outputs.cache-hit != 'true'
        run: tools/ci/build_quickshell.sh
      - name: Save the released Quickshell host
        if: steps.quickshell-build.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: target/quickshell-build
          key: ${{ steps.quickshell-build.outputs.cache-primary-key }}
      - name: Check the separate Qt workspace
        if: contains(matrix.groups, 'lint')
        run: |
          export LD_LIBRARY_PATH="$PWD/target/qt-sdk/6.11.2/gcc_64/lib${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}"
          cargo fmt --manifest-path backends/quickshell/resina-qt-runtime/Cargo.toml -- --check
          cargo test --manifest-path backends/quickshell/resina-qt-runtime/Cargo.toml --locked
          cargo clippy --manifest-path backends/quickshell/resina-qt-runtime/Cargo.toml --all-targets --locked -- -D warnings
      - name: Build the separate Qt workspace
        run: |
          export LD_LIBRARY_PATH="$PWD/target/qt-sdk/6.11.2/gcc_64/lib${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}"
          cargo build --manifest-path backends/quickshell/resina-qt-runtime/Cargo.toml --locked
          cargo build -p resina-raster --bin resina-command-raster --bin resina-command-motion-raster --bin resina-toggle-part-raster --bin resina-toggle-part-motion-raster --bin resina-paint-raster --locked
          cargo build -p resina-resolver --bin resina-theme-resolve --bin resina-surface-paint --bin resina-command-paint --locked
          python tools/material_scenarios.py -- target/qt-runtime-build/debug/resina-theme-resolve - > target/material-scenes.json
          python tools/prepare_qt_runtime_module.py --library target/qt-runtime-build/debug/libresina_qt_runtime.so --metadata-dir target/qt-runtime-export/qml_modules/Resina/Runtime --output-dir target/qt-runtime-import
      - name: Build the release runtime module for motion timing
        if: contains(matrix.groups, 'release-module')
        run: |
          export LD_LIBRARY_PATH="$PWD/target/qt-sdk/6.11.2/gcc_64/lib${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}"
          cargo build --manifest-path backends/quickshell/resina-qt-runtime/Cargo.toml --release --locked
          python tools/prepare_qt_runtime_module.py --library target/qt-runtime-build/release/libresina_qt_runtime.so --metadata-dir target/qt-runtime-export/qml_modules/Resina/Runtime --output-dir target/qt-runtime-release-import
      - name: Check compiled controller, native content and coherent snapshots
        if: contains(matrix.groups, 'snapshots')
        run: |
          python tools/check_qt_controller_lifetime.py --module-path target/qt-runtime-import
          python tools/check_qt_controller_lifetime.py --module-path target/qt-runtime-import --controller ToggleController
          python tools/check_qt_command_runtime.py --module-path target/qt-runtime-import
          python tools/check_qt_toggle_runtime.py --module-path target/qt-runtime-import
          python tools/check_qt_toggle_control_runtime.py --motion --raster target/qt-runtime-build/debug/resina-toggle-part-motion-raster --module-path target/qt-runtime-import --font-dir /usr/share/fonts/opentype/inter --output-dir target/qt-toggle-moving-control
          python tools/check_qt_command_label_runtime.py --module-path target/qt-runtime-import --font-dir /usr/share/fonts/opentype/inter
          python tools/check_qt_command_snapshot_runtime.py --module-path target/qt-runtime-import --font-dir /usr/share/fonts/opentype/inter
          python tools/check_qt_command_keyboard_runtime.py --module-path target/qt-runtime-import --font-dir /usr/share/fonts/opentype/inter
          python tools/check_qt_command_pointer_runtime.py --module-path target/qt-runtime-import --font-dir /usr/share/fonts/opentype/inter
          python tools/check_qt_command_control_runtime.py --motion --module-path target/qt-runtime-import --font-dir /usr/share/fonts/opentype/inter --output-dir target/qt-control-motion
      - name: Check actual Qt paint and command composition at native scales
        if: matrix.paint_scales != ''
        env:
          PAINT_SCALES: ${{ matrix.paint_scales }}
        run: |
          for scale in $PAINT_SCALES; do
            QT_SCALE_FACTOR="$scale" python tools/check_qt_surface_view_runtime.py --module-path target/qt-runtime-import --raster target/qt-runtime-build/debug/resina-paint-raster --resolver target/qt-runtime-build/debug/resina-surface-paint --theme-resolver target/qt-runtime-build/debug/resina-theme-resolve --scenes target/material-scenes.json --output-dir "target/qt-surface-view-$scale"
            QT_SCALE_FACTOR="$scale" python tools/check_qt_command_paint_runtime.py --module-path target/qt-runtime-import --font-dir /usr/share/fonts/opentype/inter --raster target/qt-runtime-build/debug/resina-command-raster --output-dir "target/qt-paint-$scale"
            QT_SCALE_FACTOR="$scale" python tools/check_qt_toggle_motion_runtime.py --raster target/qt-runtime-build/debug/resina-toggle-part-motion-raster --module-path target/qt-runtime-import --font-dir /usr/share/fonts/opentype/inter --output-dir "target/qt-toggle-motion-$scale"
            QT_SCALE_FACTOR="$scale" python tools/check_qt_toggle_control_runtime.py --raster target/qt-runtime-build/debug/resina-toggle-part-raster --module-path target/qt-runtime-import --font-dir /usr/share/fonts/opentype/inter --output-dir "target/qt-toggle-$scale"
            QT_SCALE_FACTOR="$scale" python tools/check_qt_command_control_runtime.py --module-path target/qt-runtime-import --font-dir /usr/share/fonts/opentype/inter --output-dir "target/qt-control-$scale"
            QT_SCALE_FACTOR="$scale" python tools/check_qt_command_motion_runtime.py --raster target/qt-runtime-build/debug/resina-command-motion-raster --module-path target/qt-runtime-import --font-dir /usr/share/fonts/opentype/inter --output-dir "target/qt-motion-$scale"
            QT_SCALE_FACTOR="$scale" python tools/check_qt_command_view_runtime.py --module-path target/qt-runtime-import --font-dir /usr/share/fonts/opentype/inter --output-dir "target/qt-view-$scale"
          done
      - name: Measure native AT-SPI availability and invocation
        if: contains(matrix.groups, 'atspi')
        env:
          RESINA_QT_RUNTIME_MODULE: ${{ github.workspace }}/target/qt-runtime-import
        run: |
          xvfb-run -a -e /dev/stderr python tools/check_qt_native_availability.py --known-deviation > target/qt-native-availability.json
          cat target/qt-native-availability.json
          xvfb-run -a -e /dev/stderr python tools/check_qt_command_control_accessibility.py --module-path target/qt-runtime-import --font-dir /usr/share/fonts/opentype/inter > target/qt-control-accessibility.json
          cat target/qt-control-accessibility.json
          xvfb-run -a -e /dev/stderr python tools/check_qt_command_control_accessibility.py --motion --module-path target/qt-runtime-import --font-dir /usr/share/fonts/opentype/inter > target/qt-motion-accessibility.json
          cat target/qt-motion-accessibility.json
          xvfb-run -a -e /dev/stderr python tools/check_qt_slider_accessibility_adapter.py --module-path target/qt-runtime-import --orientation horizontal > target/qt-slider-horizontal-accessibility.json
          cat target/qt-slider-horizontal-accessibility.json
          xvfb-run -a -e /dev/stderr python tools/check_qt_slider_accessibility_adapter.py --module-path target/qt-runtime-import --orientation vertical > target/qt-slider-vertical-accessibility.json
          cat target/qt-slider-vertical-accessibility.json
      - name: Measure released Quickshell native publication and invocation
        if: contains(matrix.groups, 'publication')
        env:
          RESINA_QT_RUNTIME_MODULE: ${{ github.workspace }}/target/qt-runtime-import
          RESINA_QUICKSHELL_HOST: ${{ github.workspace }}/target/quickshell-build/src/quickshell
        run: |
          export LD_LIBRARY_PATH="$PWD/target/wayland-sdk/lib:$PWD/target/qt-sdk/6.11.2/gcc_64/lib${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}"
          python tools/run_qt_availability_probe.py --version
          xvfb-run -a -e /dev/stderr python tools/check_qt_native_availability.py --known-deviation > target/quickshell-native-availability.json
          cat target/quickshell-native-availability.json
      - name: Check authored Command updates in released Quickshell
        if: contains(matrix.groups, 'command-updates')
        run: |
          export LD_LIBRARY_PATH="$PWD/target/wayland-sdk/lib:$PWD/target/qt-sdk/6.11.2/gcc_64/lib${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}"
          python tools/check_quickshell_command_updates.py \
            --host target/quickshell-build/src/quickshell --module-path target/qt-runtime-import \
            --font-dir /usr/share/fonts/opentype/inter \
            --alternate-font /usr/share/fonts/truetype/dejavu/DejaVuSansMono.ttf \
            --output-dir target/quickshell-command-updates --scales 1 1.25 2
      - name: Check native label measurement, drawing and resolved Inter masters in released Quickshell
        if: contains(matrix.groups, 'label')
        run: |
          export LD_LIBRARY_PATH="$PWD/target/wayland-sdk/lib:$PWD/target/qt-sdk/6.11.2/gcc_64/lib${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}"
          python tools/check_quickshell_label_runtime.py --quickshell target/quickshell-build/src/quickshell \
            --font-dir /usr/share/fonts/opentype/inter --scales 1 1.25 2
          python tools/check_quickshell_label_render_runtime.py --quickshell target/quickshell-build/src/quickshell \
            --font-dir /usr/share/fonts/opentype/inter --scales 1 1.25 2 --output-dir target/quickshell-label-render
      - name: Check authored Toggle updates in released Quickshell
        if: contains(matrix.groups, 'toggle-updates')
        run: |
          export LD_LIBRARY_PATH="$PWD/target/wayland-sdk/lib:$PWD/target/qt-sdk/6.11.2/gcc_64/lib${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}"
          python tools/check_quickshell_toggle_updates.py \
            --host target/quickshell-build/src/quickshell --module-path target/qt-runtime-import \
            --font-dir /usr/share/fonts/opentype/inter \
            --output-dir target/quickshell-toggle-updates --scales 1 1.25 2
      - name: Check compositor-delivered Command lifecycle, accessibility and motion and platform appearance
        if: contains(matrix.groups, 'command-lifecycle')
        timeout-minutes: 35
        run: |
          export LD_LIBRARY_PATH="$PWD/target/wayland-sdk/lib:$PWD/target/qt-sdk/6.11.2/gcc_64/lib${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}"
          export XDG_RUNTIME_DIR="$(mktemp -d)"
          chmod 700 "$XDG_RUNTIME_DIR"
          echo 'output HEADLESS-1 resolution 1024x600' > target/lifecycle-sway.conf
          WLR_BACKENDS=headless WLR_LIBINPUT_NO_DEVICES=1 WLR_RENDERER=pixman sway -c target/lifecycle-sway.conf > target/lifecycle-sway.log 2>&1 &
          for attempt in $(seq 50); do
            WAYLAND_DISPLAY="$(ls "$XDG_RUNTIME_DIR" | grep -m1 -E '^wayland-[0-9]+$' || true)"
            [ -n "$WAYLAND_DISPLAY" ] && break
            sleep 0.2
          done
          export WAYLAND_DISPLAY
          python tools/check_quickshell_command_lifecycle.py \
            --host target/quickshell-build/src/quickshell --module-path target/qt-runtime-import \
            --font-dir /usr/share/fonts/opentype/inter \
            --output-dir target/quickshell-command-lifecycle
          # Orca 46.1 reads its modifier keymap from an X display with xkbcomp and fails without DISPLAY.
          xvfb-run -a -e /dev/stderr python tools/check_quickshell_command_accessibility.py \
            --host target/quickshell-build/src/quickshell --module-path target/qt-runtime-import \
            --font-dir /usr/share/fonts/opentype/inter \
            --output-dir target/quickshell-command-accessibility --screen-reader
          python tools/check_quickshell_command_motion.py \
            --host target/quickshell-build/src/quickshell --module-path target/qt-runtime-import \
            --font-dir /usr/share/fonts/opentype/inter \
            --output-dir target/quickshell-command-motion --scale 1
          python tools/check_qt_platform_appearance.py --module-path target/qt-runtime-import \
            --output-dir target/qt-platform-appearance --require contrast color-scheme
          python tools/check_quickshell_clock_shell.py \
            --host target/quickshell-build/src/quickshell --module-path target/qt-runtime-import \
            --font-dir /usr/share/fonts/opentype/inter \
            --surface-resolver target/qt-runtime-build/debug/resina-surface-paint \
            --theme-resolver target/qt-runtime-build/debug/resina-theme-resolve \
            --grim /usr/bin/grim --paint-raster target/qt-runtime-build/debug/resina-paint-raster \
            --command-raster target/qt-runtime-build/debug/resina-command-raster \
            --command-resolver target/qt-runtime-build/debug/resina-command-paint \
            --output-dir target/quickshell-clock-shell --scale 1 \
            --test-settings --require reduced-motion contrast color-scheme
      - name: Check compositor-delivered Toggle lifecycle in released Quickshell
        if: contains(matrix.groups, 'toggle-lifecycle')
        timeout-minutes: 15
        run: |
          export LD_LIBRARY_PATH="$PWD/target/wayland-sdk/lib:$PWD/target/qt-sdk/6.11.2/gcc_64/lib${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}"
          export XDG_RUNTIME_DIR="$(mktemp -d)"
          chmod 700 "$XDG_RUNTIME_DIR"
          echo 'output HEADLESS-1 resolution 1024x600' > target/toggle-lifecycle-sway.conf
          WLR_BACKENDS=headless WLR_LIBINPUT_NO_DEVICES=1 WLR_RENDERER=pixman sway -c target/toggle-lifecycle-sway.conf > target/toggle-lifecycle-sway.log 2>&1 &
          for attempt in $(seq 50); do
            WAYLAND_DISPLAY="$(ls "$XDG_RUNTIME_DIR" | grep -m1 -E '^wayland-[0-9]+$' || true)"
            [ -n "$WAYLAND_DISPLAY" ] && break
            sleep 0.2
          done
          export WAYLAND_DISPLAY
          python tools/check_quickshell_toggle_lifecycle.py \
            --host target/quickshell-build/src/quickshell --module-path target/qt-runtime-import \
            --font-dir /usr/share/fonts/opentype/inter \
            --output-dir target/quickshell-toggle-lifecycle
      - name: Check compositor-delivered Command motion and the clock shell at output scales 1.25 and 2 with a live scale change
        if: matrix.output_scales != ''
        env:
          OUTPUT_SCALES: ${{ matrix.output_scales }}
        timeout-minutes: 30
        run: |
          export LD_LIBRARY_PATH="$PWD/target/wayland-sdk/lib:$PWD/target/qt-sdk/6.11.2/gcc_64/lib${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}"
          status=0
          for scales in $OUTPUT_SCALES; do
            scale=${scales%%:*}
            live=${scales##*:}
            XDG_RUNTIME_DIR="$(mktemp -d)"
            export XDG_RUNTIME_DIR
            chmod 700 "$XDG_RUNTIME_DIR"
            echo "output HEADLESS-1 resolution 1280x720 scale $scale" > "target/scale-sway-$scale.conf"
            WLR_BACKENDS=headless WLR_LIBINPUT_NO_DEVICES=1 WLR_RENDERER=pixman sway -c "target/scale-sway-$scale.conf" > "target/scale-sway-$scale.log" 2>&1 &
            sway_pid=$!
            WAYLAND_DISPLAY=
            for _ in $(seq 50); do
              for socket in "$XDG_RUNTIME_DIR"/wayland-*; do
                if [ -S "$socket" ]; then WAYLAND_DISPLAY="${socket##*/}"; fi
              done
              [ -n "$WAYLAND_DISPLAY" ] && break
              sleep 0.2
            done
            export WAYLAND_DISPLAY
            python tools/check_quickshell_command_motion.py \
              --host target/quickshell-build/src/quickshell --module-path target/qt-runtime-import \
              --font-dir /usr/share/fonts/opentype/inter \
              --output-dir "target/quickshell-command-motion-$scale" --scale "$scale" --live-scale "$live" || status=1
            swaymsg -s "$(ls "$XDG_RUNTIME_DIR"/sway-ipc.*.sock)" output HEADLESS-1 scale "$scale" || status=1
            python tools/check_quickshell_clock_shell.py \
              --host target/quickshell-build/src/quickshell --module-path target/qt-runtime-import \
              --font-dir /usr/share/fonts/opentype/inter \
              --surface-resolver target/qt-runtime-build/debug/resina-surface-paint \
              --theme-resolver target/qt-runtime-build/debug/resina-theme-resolve \
              --grim /usr/bin/grim --paint-raster target/qt-runtime-build/debug/resina-paint-raster \
              --command-raster target/qt-runtime-build/debug/resina-command-raster \
              --command-resolver target/qt-runtime-build/debug/resina-command-paint \
              --output-dir "target/quickshell-clock-shell-$scale" \
              --scale "$scale" --live-scale "$live" --require contrast color-scheme || status=1
            kill "$sway_pid" || true
            wait "$sway_pid" || true
          done
          exit "$status"
      - name: Qualify Command motion frame timing with the release module in released Quickshell
        if: contains(matrix.groups, 'frame-timing')
        timeout-minutes: 20
        run: |
          export LD_LIBRARY_PATH="$PWD/target/wayland-sdk/lib:$PWD/target/qt-sdk/6.11.2/gcc_64/lib${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}"
          status=0
          for scale in 1 2; do
            XDG_RUNTIME_DIR="$(mktemp -d)"
            export XDG_RUNTIME_DIR
            chmod 700 "$XDG_RUNTIME_DIR"
            echo "output HEADLESS-1 resolution 1024x600 scale $scale" > "target/budget-sway-$scale.conf"
            WLR_BACKENDS=headless WLR_LIBINPUT_NO_DEVICES=1 WLR_RENDERER=pixman sway -c "target/budget-sway-$scale.conf" > "target/budget-sway-$scale.log" 2>&1 &
            sway_pid=$!
            WAYLAND_DISPLAY=
            for _ in $(seq 50); do
              for socket in "$XDG_RUNTIME_DIR"/wayland-*; do
                if [ -S "$socket" ]; then WAYLAND_DISPLAY="${socket##*/}"; fi
              done
              [ -n "$WAYLAND_DISPLAY" ] && break
              sleep 0.2
            done
            export WAYLAND_DISPLAY
            python tools/check_quickshell_command_motion_budget.py \
              --host target/quickshell-build/src/quickshell --module-path target/qt-runtime-release-import \
              --font-dir /usr/share/fonts/opentype/inter \
              --output-dir "target/quickshell-command-motion-budget-$scale" --scale "$scale" --floor report --require-gap || status=1
            kill "$sway_pid" || true
            wait "$sway_pid" || true
          done
          exit "$status"
      - name: Save native Qt captures and accessibility observations
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: qt-native-command-evidence-${{ matrix.shard }}
          path: |
            target/qt-toggle-*/*.png
            target/qt-paint-*/*.png
            target/qt-surface-view-*/*.png
            target/qt-view-*/*.png
            target/qt-control-*/*.png
            target/qt-motion-*/*.png
            target/qt-motion-accessibility.json
            target/qt-slider-*-accessibility.json
            target/qt-control-accessibility.json
            target/qt-native-availability.json
