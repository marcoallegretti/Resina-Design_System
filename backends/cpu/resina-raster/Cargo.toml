[package]
name = "resina-raster"
version = "0.0.1"
edition = "2024"
description = "Bounded CPU realization of Resina surface and focus paint"

[features]
default = ["png"]
png = ["dep:png"]

[dependencies]
resina-color = { path = "../../../reference/rust/resina-color" }
resina-model = { path = "../../../reference/rust/resina-model" }
resina-resolver = { path = "../../../reference/rust/resina-resolver" }
png = { version = "0.18.1", optional = true }
num-bigint = "0.5.1"
num-rational = { version = "=0.4.2", default-features = false, features = ["std"] }
num-traits = "0.2"

[dev-dependencies]
serde = { version = "1", features = ["derive"] }
serde_json.workspace = true

[[bench]]
name = "paint"
harness = false
test = false

[[bin]]
name = "resina-surface-raster"
required-features = ["png"]

[[bin]]
name = "resina-focus-raster"
required-features = ["png"]

[[bin]]
name = "resina-paint-raster"
required-features = ["png"]

[[bin]]
name = "resina-relief-raster"
required-features = ["png"]

[[bin]]
name = "resina-material-relief-raster"
required-features = ["png"]

[[bin]]
name = "resina-command-raster"
required-features = ["png"]

[[bin]]
name = "resina-command-motion-raster"
required-features = ["png"]

[[bin]]
name = "resina-toggle-part-raster"
required-features = ["png"]

[[bin]]
name = "resina-toggle-part-motion-raster"
required-features = ["png"]
