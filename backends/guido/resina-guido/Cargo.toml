[package]
name = "resina-guido"
version = "0.1.0"
edition = "2024"
description = "Prepared Resina surface and focus paint for GUIdo"

[workspace]

[features]
testing = ["guido/testing"]

[dependencies]
guido = { git = "https://github.com/MalpenZibo/guido", rev = "f7cb5b59c8d848b57efe2b73fb861eac12105925", default-features = false }
resina-model = { path = "../../../reference/rust/resina-model" }
resina-resolver = { path = "../../../reference/rust/resina-resolver" }
resina-raster = { path = "../../cpu/resina-raster", default-features = false }

[dev-dependencies]
resina-color = { path = "../../../reference/rust/resina-color" }
resina-environment = { path = "../../../reference/rust/resina-environment" }
serde_json = { version = "1", features = ["float_roundtrip"] }
wgpu = { version = "=30.0.1", default-features = false }
